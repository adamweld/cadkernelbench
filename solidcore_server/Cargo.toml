# SPDX-License-Identifier: MIT OR Apache-2.0
# A small server that lets the Python benchmark drive solidcore
# (https://github.com/tangency-labs/solidcore, Apache-2.0).
# Replace SOLIDCORE below with the path of solidcore/ inside a SolidCraft checkout, then build
# (docs/RUNNING.md, task 1). Cargo.lock is solidcore's own, so dependencies match its tests.
[package]
name = "solidcore-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
solidcore-ops = { path = "SOLIDCORE/crates/solidcore-ops" }
solidcore-tess = { path = "SOLIDCORE/crates/solidcore-tess" }
serde_json = "1"

[profile.release]
debug = false
